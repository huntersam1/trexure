<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B4A70"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D4AF37"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8E44AD"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1600" height="900" fill="#F7F9FB"/>

  <!-- ============ Railway boundary ============ -->
  <rect x="320" y="110" width="750" height="700" rx="18" fill="#ffffff" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="345" y="150" font-size="20" font-weight="600" fill="#5B4A70" letter-spacing="2">RAILWAY — ONE PROJECT</text>

  <!-- web service -->
  <rect x="370" y="200" width="300" height="150" rx="12" fill="#F5EEF8" stroke="#8E44AD" stroke-width="2.5"/>
  <text x="520" y="245" font-size="26" font-weight="700" fill="#1A1025" text-anchor="middle">web</text>
  <text x="520" y="275" font-size="17" fill="#5B4A70" text-anchor="middle">Next.js 16 · RSC</text>
  <text x="520" y="300" font-size="15" fill="#5B4A70" text-anchor="middle">UI · API routes · auth</text>
  <text x="520" y="322" font-size="15" fill="#5B4A70" text-anchor="middle">webhook ingest (HMAC-verified)</text>

  <!-- worker service -->
  <rect x="370" y="580" width="300" height="150" rx="12" fill="#F5EEF8" stroke="#8E44AD" stroke-width="2.5"/>
  <text x="520" y="625" font-size="26" font-weight="700" fill="#1A1025" text-anchor="middle">worker</text>
  <text x="520" y="655" font-size="17" fill="#5B4A70" text-anchor="middle">BullMQ consumer</text>
  <text x="520" y="680" font-size="15" fill="#5B4A70" text-anchor="middle">watch-onchain · reconcile</text>
  <text x="520" y="702" font-size="15" fill="#5B4A70" text-anchor="middle">receipts → SETTLED</text>

  <!-- Postgres -->
  <rect x="790" y="200" width="240" height="150" rx="12" fill="#ffffff" stroke="#5B4A70" stroke-width="2"/>
  <text x="910" y="250" font-size="22" font-weight="700" fill="#1A1025" text-anchor="middle">Postgres 17</text>
  <text x="910" y="280" font-size="15" fill="#5B4A70" text-anchor="middle">source of truth</text>
  <text x="910" y="302" font-size="15" fill="#5B4A70" text-anchor="middle">tenant-isolated rows</text>

  <!-- Redis -->
  <rect x="790" y="580" width="240" height="150" rx="12" fill="#ffffff" stroke="#5B4A70" stroke-width="2"/>
  <text x="910" y="630" font-size="22" font-weight="700" fill="#1A1025" text-anchor="middle">Redis</text>
  <text x="910" y="660" font-size="15" fill="#5B4A70" text-anchor="middle">job queue</text>
  <text x="910" y="682" font-size="15" fill="#5B4A70" text-anchor="middle">idempotency cache</text>

  <!-- ============ Externals ============ -->
  <!-- Stellar testnet -->
  <rect x="1180" y="170" width="360" height="200" rx="12" fill="#FDF8EA" stroke="#D4AF37" stroke-width="2.5"/>
  <text x="1360" y="215" font-size="24" font-weight="700" fill="#1A1025" text-anchor="middle">Stellar testnet</text>
  <text x="1360" y="248" font-size="16" fill="#5B4A70" text-anchor="middle">Soroban RPC · Horizon</text>
  <text x="1360" y="278" font-size="16" fill="#5B4A70" text-anchor="middle">shielded_transfer contract</text>
  <text x="1360" y="308" font-size="16" fill="#5B4A70" text-anchor="middle">Groth16 verifier (BLS12-381)</text>
  <text x="1360" y="345" font-size="13" font-weight="600" fill="#8a5a00" text-anchor="middle" letter-spacing="1">REAL — ON-CHAIN</text>

  <!-- Mock Anchor -->
  <rect x="1180" y="560" width="360" height="180" rx="12" fill="#ffffff" stroke="#5B4A70" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1360" y="608" font-size="24" font-weight="700" fill="#1A1025" text-anchor="middle">Mock Anchor</text>
  <text x="1360" y="640" font-size="16" fill="#5B4A70" text-anchor="middle">fiat payout provider stand-in</text>
  <text x="1360" y="668" font-size="16" fill="#5B4A70" text-anchor="middle">(swaps for Xendit — same contract)</text>
  <text x="1360" y="705" font-size="13" font-weight="600" fill="#5B4A70" text-anchor="middle" letter-spacing="1">MOCK — SAME SIGNED WEBHOOK</text>

  <!-- Browser -->
  <rect x="40" y="380" width="200" height="140" rx="12" fill="#ffffff" stroke="#5B4A70" stroke-width="2"/>
  <text x="140" y="430" font-size="20" font-weight="700" fill="#1A1025" text-anchor="middle">Finance team</text>
  <text x="140" y="458" font-size="15" fill="#5B4A70" text-anchor="middle">dashboard · receipts</text>
  <text x="140" y="480" font-size="15" fill="#5B4A70" text-anchor="middle">view key never leaves server</text>

  <!-- ============ Flows ============ -->
  <!-- browser -> web -->
  <path d="M240 440 C290 440 300 300 368 285" fill="none" stroke="#5B4A70" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="268" y="392" font-size="14" fill="#5B4A70">HTTPS</text>

  <!-- web <-> postgres -->
  <line x1="672" y1="255" x2="787" y2="255" stroke="#5B4A70" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="729" y="243" font-size="14" fill="#5B4A70" text-anchor="middle">Prisma</text>

  <!-- web -> redis (enqueue) -->
  <path d="M600 352 C640 430 740 520 800 578" fill="none" stroke="#5B4A70" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="712" y="465" font-size="14" fill="#5B4A70">enqueue</text>

  <!-- redis -> worker (consume) -->
  <line x1="787" y1="655" x2="673" y2="655" stroke="#5B4A70" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="730" y="643" font-size="14" fill="#5B4A70" text-anchor="middle">consume</text>

  <!-- worker -> postgres -->
  <path d="M620 578 C680 500 800 420 880 353" fill="none" stroke="#5B4A70" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="762" y="505" font-size="14" fill="#5B4A70">SETTLED + receipt</text>

  <!-- web -> stellar (submit) -->
  <path d="M672 230 C900 175 1000 195 1177 235" fill="none" stroke="#8E44AD" stroke-width="3" marker-end="url(#arrowViolet)"/>
  <text x="860" y="152" font-size="15" font-weight="600" fill="#8E44AD">submit shielded_transfer + ZK commitment</text>

  <!-- worker -> stellar (poll events) -->
  <path d="M672 610 C950 540 1120 430 1220 372" fill="none" stroke="#8E44AD" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowViolet)"/>
  <text x="945" y="520" font-size="15" font-weight="600" fill="#8E44AD">poll contract events</text>

  <!-- web -> mock anchor (trigger payout) -->
  <path d="M672 330 C960 400 1080 520 1177 600 " fill="none" stroke="#D4AF37" stroke-width="3" marker-end="url(#arrowGold)"/>
  <text x="960" y="415" font-size="15" font-weight="600" fill="#8a5a00">trigger payout</text>

  <!-- mock anchor -> web (webhook ingest at /api/webhooks/fiat) -->
  <path d="M1177 710 C760 880 300 790 364 340" fill="none" stroke="#D4AF37" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowGold)"/>
  <text x="620" y="845" font-size="15" font-weight="600" fill="#8a5a00">payment.completed webhook (HMAC-signed) → web ingests, worker reconciles</text>

  <!-- caption -->
  <text x="1560" y="878" font-size="14" fill="#5B4A70" text-anchor="end" font-style="italic">Trexure — web + worker reconcile the on-chain and fiat legs by intentId into one receipt</text>
</svg>
