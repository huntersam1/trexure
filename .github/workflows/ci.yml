name: CI

on:
  push:
    branches: [main, develop]
  # Run on every PR regardless of base branch so stacked PRs (e.g. phase N
  # targeting phase N-1's branch before it merges to develop) are validated too.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-secret config consumed by lib/env.ts (Zod fail-fast at boot). Real
  # secrets for the deployed app come from platform variables, never from here.
  APP_URL: "http://localhost:3000"
  DATABASE_URL: "postgresql://trexure:trexure@localhost:5432/trexure?schema=public"
  SHADOW_DATABASE_URL: "postgresql://trexure:trexure@localhost:5432/trexure_shadow"
  REDIS_URL: "redis://localhost:6379"
  SESSION_COOKIE_NAME: "__Host-trexure_session"
  STELLAR_NETWORK: "testnet"
  STELLAR_RPC_URL: "https://soroban-testnet.stellar.org"
  STELLAR_HORIZON_URL: "https://horizon-testnet.stellar.org"
  STELLAR_SOURCE_SECRET: "SCIXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
  ZK_CONTRACT_ID: "CDEMO0000000000000000000000000000000000000000000000000000"
  ANCHOR_PROVIDER: "mock-anchor"
  ENABLE_MOCK_ANCHOR: "true"
  S3_ENDPOINT: "http://localhost:9000"
  S3_REGION: "us-east-1"
  S3_ACCESS_KEY_ID: "minioadmin"
  S3_SECRET_ACCESS_KEY: "minioadmin"
  S3_BUCKET: "trexure-receipts"
  S3_FORCE_PATH_STYLE: "true"

jobs:
  quality:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: trexure
          POSTGRES_PASSWORD: trexure
          POSTGRES_DB: trexure
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trexure"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral CI secrets
        run: |
          {
            echo "MASTER_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "CSRF_SECRET=$(openssl rand -hex 32)"
            echo "ANCHOR_CALLBACK_TOKEN=$(openssl rand -hex 24)"
          } >> "$GITHUB_ENV"

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  build:
    name: Next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral CI secrets
        run: |
          {
            echo "MASTER_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "CSRF_SECRET=$(openssl rand -hex 32)"
            echo "ANCHOR_CALLBACK_TOKEN=$(openssl rand -hex 24)"
          } >> "$GITHUB_ENV"

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: Build
        run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gating: fail on any high-severity advisory. The previously-flagged highs
      # (axios via @stellar/stellar-sdk) are resolved by the pnpm override to
      # axios ^1.16.0 in package.json.
      - name: Audit (high severity)
        run: pnpm audit --audit-level high
