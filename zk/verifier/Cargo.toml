[package]
name = "groth16-verifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
doctest = false

[features]
# The ShieldedPool (#62) is a SPIKE, kept OUT of the default build so the
# production Groth16Verifier wasm doesn't drift. Build/test it explicitly:
#   cargo test --features pool
#   cargo build --release --target wasm32-unknown-unknown --features pool
pool = []

[dependencies]
soroban-sdk = "22"

[dev-dependencies]
soroban-sdk = { version = "22", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
